<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AP Desk · Invoice to decision</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0a'/%3E%3Cpath d='M9 17l4.5 4.5L23 11' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="logo" href="#/invoices">
      <div class="logo-mark"><svg viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg></div>
      <div><b>AP Desk</b><span>Invoice to decision</span></div>
    </a>
    <nav class="nav" id="nav">
      <div class="nav-label">Payables</div>
      <a href="#/invoices" data-route="invoices">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2.5 9.5h3l1 2h3l1-2h3"/><path d="M2.5 9.5l1.6-5.2A1 1 0 015.1 3.5h5.8a1 1 0 01.96.8l1.64 5.2V12a1 1 0 01-1 1h-9a1 1 0 01-1-1z"/></svg>
        Invoices <span class="badge hidden" id="nav-hold"></span></a>
      <a href="#/upload" data-route="upload">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M8 10.5V3m0 0L5 6m3-3l3 3M3 10v2a1 1 0 001 1h8a1 1 0 001-1v-2"/></svg>
        Upload</a>
      <div class="nav-label">Data</div>
      <a href="#/reference" data-route="reference">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><ellipse cx="8" cy="4" rx="5" ry="1.8"/><path d="M3 4v8c0 1 2.2 1.8 5 1.8s5-.8 5-1.8V4M3 8c0 1 2.2 1.8 5 1.8s5-.8 5-1.8"/></svg>
        Vendors &amp; POs</a>
      <a href="#/how" data-route="how">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="5.5"/><path d="M8 7.5V11M8 5h.01"/></svg>
        How it works</a>
    </nav>
    <div class="side-foot">
      <div class="engine"><i></i><div>Extraction engine<b id="engine-label">…</b></div></div>
      <button class="side-btn" id="reset-btn" title="Clears run history and restores the AP ledger to its seeded state">Reset demo data</button>
    </div>
  </aside>
  <div class="main">
    <header class="topbar"><div class="crumbs" id="crumbs"></div><span class="grow"></span><span id="top-actions"></span></header>
    <main class="page" id="view"></main>
  </div>
</div>
<input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
<script src="app.js?v=2"></script>
</body>
</html>
