<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice → Decision · AP automation</title>

<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand">

      <div>
        <div class="brand-name">Invoice → Decision</div>
        <div class="brand-sub">Accounts payable automation</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <a href="#/process" data-route="process">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M10 3v10m0-10L6 7m4-4l4 4M4 13v2.5A1.5 1.5 0 005.5 17h9a1.5 1.5 0 001.5-1.5V13"/></svg>
        Process invoice</a>

        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="6" height="7" rx="1.2"/><rect x="11" y="3" width="6" height="4" rx="1.2"/><rect x="11" y="9" width="6" height="8" rx="1.2"/><rect x="3" y="12" width="6" height="5" rx="1.2"/></svg>

      <a href="#/reference" data-route="reference">

    <div class="sidebar-foot">
      <div class="engine-pill"><span class="engine-dot"></span>Extraction engine<b id="engine-label">…</b></div>
      <button class="link-btn" id="reset-btn" title="Clears run history and restores the AP ledger to its seeded state">↺ Reset demo data</button>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<input type="file" id="file-input" accept="application/pdf,.pdf" hidden>
<script src="/app.js"></script>
